<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GAICA - Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

</head>

<body>

<div class="container">

    <div class="login-box">

        <h1>GAICA</h1>

        <h3>Global Agentic AI Crisis Assistant</h3>

        <hr>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <p style="color: {{ 'green' if category == 'success' else ('blue' if category == 'info' else 'red') }}; font-weight: bold;">
                        {{ message }}
                    </p>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/login" method="POST">

            <label>Email</label>

            <input type="email"
                   name="email"
                   placeholder="Enter Email"
                   required>

            <br><br>

            <label>Password</label>

            <input type="password"
                   name="password"
                   placeholder="Enter Password"
                   required>

            <br><br>

            <button type="submit">

                Login

            </button>

        </form>

        <br>

        <p>

            Don't have an account?

            <a href="/register">

                Register Here

            </a>

        </p>

        <br>

        <a href="/">⬅ Back to Home</a>

    </div>

</div>

</body>

</html>
